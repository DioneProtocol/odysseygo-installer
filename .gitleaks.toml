# Gitleaks config for odysseygo-installer
# https://github.com/gitleaks/gitleaks#configuration
# useDefault loads built-in rules; add allowlist entries below for false positives.

title = "odysseygo-installer gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Exclude config and common non-secret paths"
paths = [
  '''\.gitleaks\.toml$''',
  '''\.pre-commit-config\.yaml$''',
]
