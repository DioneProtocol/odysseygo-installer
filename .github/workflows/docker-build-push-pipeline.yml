name: Build and Push Docker Image

on:
  # Trigger on repository dispatch from odysseygo release
  repository_dispatch:
    types: [odysseygo-release]
  # Manual trigger with version input
  workflow_dispatch:
    inputs:
      version:
        description: 'OdysseyGo version (e.g., v1.10.11 or 1.10.11). Leave empty for latest.'
        required: false
        type: string
      push_to_registry:
        description: 'Push to Docker Hub'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: docker.io
  IMAGE_NAME: odysseygo

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event.inputs.push_to_registry != 'false' && (github.event_name == 'push' || github.event_name == 'repository_dispatch' || github.event.inputs.push_to_registry == 'true')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            VERSION="${{ github.event.client_payload.version }}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="latest"
          fi
          
          # Normalize version (remove 'v' prefix if present, then add back for tag)
          VERSION_CLEAN=${VERSION#v}
          VERSION_TAG="v${VERSION_CLEAN}"
          
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_clean=${VERSION_CLEAN}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "Determined version: ${VERSION} (tag: ${VERSION_TAG})"

      - name: Determine if this is a production release
        id: is_production
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_production=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_production=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.version_tag }},enable=${{ steps.is_production.outputs.is_production == 'true' }}
            type=raw,value=latest,enable=${{ steps.is_production.outputs.is_production == 'true' }}
            type=raw,value=develop
            type=sha,prefix={{branch}}-,format=short
            type=raw,value={{branch}}-${{ github.sha }}

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.push_to_registry != 'false' && (github.event_name == 'push' || github.event_name == 'repository_dispatch' || github.event.inputs.push_to_registry == 'true') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ODOMYSGO_VERSION_ARG=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image details confirmation
        run: |
          echo "✅ Multi-arch Docker Image built successfully!"
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Platforms: linux/amd64, linux/arm64"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          if [ "${{ github.event.inputs.push_to_registry }}" != "false" ] && ([ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "repository_dispatch" ] || [ "${{ github.event.inputs.push_to_registry }}" = "true" ]); then
            echo "✅ Image pushed to Docker Hub"
          else
            echo "ℹ️  Image not pushed (local build only)"
          fi

      - name: Notify on success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#dev-pipeline'
          fields: repo,message,commit,author,action,eventName,ref,workflow
          text: |
            ✅ Multi-Arch Docker Image Built Successfully
            Repository: ${{ github.repository }}
            Version: ${{ steps.version.outputs.version }}
            Platforms: linux/amd64, linux/arm64
            Tags: ${{ steps.meta.outputs.tags }}
            Event: ${{ github.event_name }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.DIONE_SLACK_WEBHOOK_DEV_PIPELINE_URL }}

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#dev-pipeline'
          fields: repo,message,commit,author,action,eventName,ref,workflow
          text: |
            ❌ Docker Image Build Failed
            Repository: ${{ github.repository }}
            Version: ${{ steps.version.outputs.version }}
            Event: ${{ github.event_name }}
            Check the logs for details.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.DIONE_SLACK_WEBHOOK_DEV_PIPELINE_URL }}
