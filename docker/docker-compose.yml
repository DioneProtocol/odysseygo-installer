version: '3.8'

services:
  odysseygo:
    image: dionetech/odysseygo:develop
    user: root
    restart: no
    environment:
      - NETWORK=${NETWORK:-testnet}
      - BOOTSTRAP_URL=${BOOTSTRAP_URL:-https://odysseygo-bootstraps.nyc3.cdn.digitaloceanspaces.com/odyssey-bootstrap-testnet.zip}
      - RPC_ACCESS=${RPC_ACCESS:-public}
      - STATE_SYNC=${STATE_SYNC:-off}
      - IP_MODE=${IP_MODE:-dynamic}
      - PUBLIC_IP=${PUBLIC_IP:-0.0.0.0}
      - DB_DIR=${DB_DIR:-/odysseygo/db}
      - LOG_LEVEL_NODE=${LOG_LEVEL_NODE:-info}
      - LOG_LEVEL_DCHAIN=${LOG_LEVEL_DCHAIN:-info}
      - INDEX_ENABLED=${INDEX_ENABLED:-true}
      - ARCHIVAL_MODE=${ARCHIVAL_MODE:-true}
      - ADMIN_API=${ADMIN_API:-false}
      - ETH_DEBUG_RPC=${ETH_DEBUG_RPC:-true}
    volumes:
      - "${PWD}/data/.odysseygo:/odysseygo/.odysseygo"
      - "${PWD}/data/db:/odysseygo/db"
      - "${PWD}/logs:/var/log/odysseygo"
      # You can still mount a local file if available; otherwise it will download.
      # - "${PWD}/odyssey-bootstrap-testnet.zip:/odysseygo-bootstrap/odyssey-bootstrap-testnet.zip:ro"
      # - "${PWD}/odyssey-bootstrap-mainnet.zip:/odysseygo-bootstrap/odyssey-bootstrap-mainnet.zip:ro"
    ports:
      - "${RPC_HOST_PORT:-9650}:9650"
      - "${P2P_HOST_PORT:-9651}:9651"
    healthcheck:
      test: >
        curl -sf -X POST --data '{"jsonrpc":"2.0","id":1,"method":"info.getNodeID"}'
        -H 'content-type:application/json'
        http://localhost:9650/ext/info || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
